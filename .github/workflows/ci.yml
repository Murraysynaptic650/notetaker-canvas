name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` over `npm install` so the lockfile is authoritative — a green
      # CI run then means the exact dependency set a contributor gets locally.
      - run: npm ci

      # Same gate as the local `npm run verify`: typecheck + lint + coverage
      # (thresholds live in vitest.config.ts).
      - run: npm run verify

      - run: npm run build
