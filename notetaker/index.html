<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Full-screen, notch-aware, no user zoom (tldraw handles its own zoom). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notetaker" />
    <meta name="theme-color" content="#101011" />

    <title>Notetaker Canvas</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Dev diagnostic: paint otherwise-invisible startup errors into the page.
         Catches module-load failures that happen before React mounts. Remove
         once the app is stable. -->
    <script>
      (function () {
        function paint(title, detail) {
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<div style="font:14px/1.5 ui-monospace,Menlo,monospace;padding:24px;' +
            'color:#111;background:#fff;height:100%;overflow:auto;white-space:pre-wrap">' +
            '<strong style="color:#c00;font-size:16px">' + title + '</strong>\n\n' +
            String(detail).replace(/[<>&]/g, function (c) {
              return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
            }) +
            '</div>'
        }
        window.addEventListener('error', function (e) {
          paint('Startup error', (e.error && e.error.stack) || e.message)
        })
        window.addEventListener('unhandledrejection', function (e) {
          paint('Unhandled promise rejection', (e.reason && e.reason.stack) || e.reason)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
